 <!DOCTYPE html>
<html>
<head>
    <title>sample login page</title>
    <link rel="stylesheet" href="animate.css">
</head>
<body>


<div class="login-box">
    <label><h1>LOG INTO YOUR ACCOUNT</h1></label><br>
    <label class="label">username</label><br>
    <input type="text" class="username" placeholder="username" required><br>

    <label class="label">password</label><br>
    <input type="password" class=" password" placeholder="password" required><br>

    select role:<br>
    <input type="radio" name="role" id="student">
    <label for="student" class="role">student</label><br>

    <input type="radio" name="role" id="teacher">
    <label for="teacher" class="role">teacher</label><br>

    <input type="submit" value="login">
<p class=vas>@All rights reserved</p>
</div>

</body>
</html>
